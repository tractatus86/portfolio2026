<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shingo Kawamura · Makers</title>
<meta name="description" content="Shingo Kawamura: textile, CMF and materials.">
<link rel="preload" href="makers/fonts/Anton.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Anton";src:url(makers/fonts/Anton.woff2) format("woff2");font-display:block}
:root{--figtree:"Figtree",system-ui,sans-serif;--label:"DIN Alternate","Barlow Condensed",system-ui,sans-serif}
html,body{margin:0;height:100%;background:#0b0b0b;overflow:hidden}
/* square stage that covers the window, like object-fit: cover */
#stage{position:fixed;left:50%;top:50%;width:max(100vw,100svh);height:max(100vw,100svh);transform:translate(-50%,-50%);
  --u:calc(max(100vw,100svh) / 100);overflow:hidden}
/* portrait (phones): the square poster sits in the middle, cropped only slightly at the sides */
@media (orientation:portrait){#stage{width:118vw;height:118vw;--u:1.18vw}}
.F{position:absolute;inset:0;visibility:hidden}
.F.on{visibility:visible}
.L{position:absolute;transform-origin:0 0}
.img{background-size:cover;filter:contrast(1.05)}
.img.crt{border-radius:3% / 4%;box-shadow:0 0 calc(4*var(--u)) rgba(120,170,255,.25)}
.disp{font-family:"Anton","Impact","Haettenschweiler",sans-serif;line-height:.86;white-space:nowrap;letter-spacing:-.01em}
.cap{font:700 1em/1 var(--figtree);letter-spacing:.08em;white-space:nowrap}
.disc{border-radius:50%}
.half{border-radius:50%}
.ring{border-radius:50%;border:1px solid rgba(236,230,216,.55)}
.cross{background:linear-gradient(rgba(236,230,216,.55),rgba(236,230,216,.55)) 50% 0/1px 100% no-repeat,
                  linear-gradient(rgba(236,230,216,.55),rgba(236,230,216,.55)) 0 50%/100% 1px no-repeat}
.cross::after{content:"";position:absolute;inset:30%;border-radius:50%;border:1px solid rgba(236,230,216,.55)}
.grid{background-image:linear-gradient(rgba(236,230,216,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(236,230,216,.10) 1px,transparent 1px);
  background-size:calc(12.5*var(--u)) calc(12.5*var(--u))}
.line{background:rgba(236,230,216,.55)}
/* grain + scratches over everything */
#fx{position:fixed;inset:0;pointer-events:none;background-image:var(--grain);background-position:var(--gx) var(--gy);mix-blend-mode:screen;opacity:.9}
#grain{display:none}
/* site chrome: name and the way in */
.chrome{position:fixed;inset:0;pointer-events:none;padding:clamp(16px,3.2vw,56px);display:flex;flex-direction:column;justify-content:space-between}
.chrome a{pointer-events:auto;text-decoration:none}
.brand{font:700 18px var(--figtree);color:#f2f2f0}
.enter{align-self:flex-start;font:500 14px var(--label);color:#111;background:#f2f2f0;border:1px solid #f2f2f0;border-radius:999px;padding:9px 16px}
.enter:hover{background:transparent;color:#f2f2f0}
.export .chrome,.export #fx{display:none}
/* review guides */
.guides #stage::before,.guides #stage::after{content:"";position:absolute;z-index:9;pointer-events:none;border:1px dashed #0f0}
.guides #stage::before{left:27%;right:27%;top:0;bottom:0}
.guides #stage::after{top:19%;bottom:19%;left:0;right:0;border-color:#f0f}
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="fx"></div><canvas id="grain"></canvas>
<div class="chrome">
  <a class="brand" href="scope.html">Shingo Kawamura</a>
  <a class="enter" href="scope.html">Enter</a>
</div>
<h1 style="position:absolute;left:-9999px">Makers. Shingo Kawamura, textile, CMF and materials.</h1>
<script src="makers/frames.js"></script>
<script src="makers/makers.js"></script>
</body>
</html>
